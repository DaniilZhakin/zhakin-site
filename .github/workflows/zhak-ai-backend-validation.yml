name: ЖАК AI Backend Validation

on:
  push:
    paths:
      - "intelligence/ai-backend-cloudflare/**"
      - ".github/workflows/zhak-ai-backend-validation.yml"
  pull_request:
    paths:
      - "intelligence/ai-backend-cloudflare/**"
      - ".github/workflows/zhak-ai-backend-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intelligence/ai-backend-cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node syntax check
        run: node --check worker.js

      - name: Verify backend has no tracked secret material
        run: |
          ! grep -R -nE 'sk-[A-Za-z0-9_-]{20,}|OPENAI_API_KEY[[:space:]]*=' worker.js wrangler.jsonc README.md package.json

      - name: Validate Wrangler configuration
        run: npx --yes wrangler@4.35.0 deploy --dry-run

      - name: Production deployment remains disabled
        run: |
          echo "Validation only: no production deployment, no secret upload, no endpoint activation."
