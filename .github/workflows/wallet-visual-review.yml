name: ZHAKIN Wallet visual review

on:
  push:
    branches:
      - test/wallet-visual-regression-20261104
    paths:
      - "scripts/wallet-visual-smoke.mjs"
      - ".github/workflows/wallet-visual-review.yml"
  pull_request:
    paths:
      - "scripts/wallet-visual-smoke.mjs"
      - ".github/workflows/wallet-visual-review.yml"

permissions:
  contents: read

jobs:
  capture-wallet:
    name: Capture desktop and iPhone-sized Wallet views
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture and inspect the public Wallet page
        run: node scripts/wallet-visual-smoke.mjs
        env:
          WALLET_URL: https://xn--80alhhq.xn--p1ai/wallet.html

      - name: Upload real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhakin-wallet-visual-review
          path: artifacts/wallet/
          if-no-files-found: warn
          retention-days: 14
