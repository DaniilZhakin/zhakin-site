name: Institutional Registry Integrity

on:
  push:
    branches: [main]
    paths:
      - 'data/institutional-registry.json'
      - 'data/projects.json'
      - 'institutional.html'
      - 'intelligence/institutional-registry-integrity.py'
      - '.github/workflows/institutional-registry-integrity.yml'
  pull_request:
    paths:
      - 'data/institutional-registry.json'
      - 'data/projects.json'
      - 'institutional.html'
      - 'intelligence/institutional-registry-integrity.py'
      - '.github/workflows/institutional-registry-integrity.yml'

permissions:
  contents: read

jobs:
  integrity:
    name: Validate institutional registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate institutional registry
        run: python3 intelligence/institutional-registry-integrity.py
      - name: Record validation checkpoint
        run: echo "Institutional registry validation executed on $GITHUB_SHA"
