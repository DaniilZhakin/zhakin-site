name: Security robot registry tests

on:
  push:
    branches:
      - feature/security-robot-team-stage1
    paths:
      - "data/security-robot-registry.json"
      - "tests/security-robot-registry.test.js"
      - ".github/workflows/security-robot-registry-test.yml"
  pull_request:
    paths:
      - "data/security-robot-registry.json"
      - "tests/security-robot-registry.test.js"
      - ".github/workflows/security-robot-registry-test.yml"

permissions:
  contents: read

jobs:
  registry-tests:
    name: Validate security robot registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate registry JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('data/security-robot-registry.json', 'utf8'))"

      - name: Run registry safety tests
        run: node --experimental-default-type=module --test tests/security-robot-registry.test.js
