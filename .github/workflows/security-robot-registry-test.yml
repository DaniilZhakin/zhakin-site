name: Security robot registry tests

on:
  push:
    branches:
      - feature/security-robot-team-stage1
      - feature/security-robot-incident-journal
    paths:
      - "data/security-robot-registry.json"
      - "tests/security-robot-registry.test.js"
      - "data/security-robot-report.schema.json"
      - "data/security-robot-report.example.json"
      - "tests/security-robot-report-schema.test.js"
      - "src/security-robot-coordinator.js"
      - "tests/security-robot-coordinator.test.js"
      - ".github/workflows/security-robot-registry-test.yml"
      - "data/security-robot-incident-event.schema.json"
      - "src/security-robot-incident-journal.js"
      - "tests/security-robot-incident-journal.test.js"
  pull_request:
    paths:
      - "data/security-robot-registry.json"
      - "tests/security-robot-registry.test.js"
      - "data/security-robot-report.schema.json"
      - "data/security-robot-report.example.json"
      - "tests/security-robot-report-schema.test.js"
      - "src/security-robot-coordinator.js"
      - "tests/security-robot-coordinator.test.js"
      - ".github/workflows/security-robot-registry-test.yml"
      - "data/security-robot-incident-event.schema.json"
      - "src/security-robot-incident-journal.js"
      - "tests/security-robot-incident-journal.test.js"

permissions:
  contents: read

jobs:
  registry-tests:
    name: Validate security robot registry and report schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install standards-compliant JSON Schema validator
        run: npm install --no-save ajv@8 ajv-formats@3

      - name: Validate registry JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('data/security-robot-registry.json', 'utf8'))"

      - name: Validate report schema JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('data/security-robot-report.schema.json', 'utf8'))"

      - name: Validate example report JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('data/security-robot-report.example.json', 'utf8'))"

      - name: Validate incident event schema JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('data/security-robot-incident-event.schema.json', 'utf8'))"

      - name: Run security robot tests
        run: node --experimental-default-type=module --test tests/security-robot-registry.test.js tests/security-robot-report-schema.test.js tests/security-robot-coordinator.test.js tests/security-robot-incident-journal.test.js
