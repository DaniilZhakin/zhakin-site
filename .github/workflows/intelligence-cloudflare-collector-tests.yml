name: Intelligence Cloudflare Collector Validation

on:
  push:
    paths:
      - 'intelligence/collector-cloudflare/**'
      - 'docs/intelligence-3.0-collector-contract.schema.json'
      - '.github/workflows/intelligence-cloudflare-collector-tests.yml'
  pull_request:
    paths:
      - 'intelligence/collector-cloudflare/**'
      - 'docs/intelligence-3.0-collector-contract.schema.json'
      - '.github/workflows/intelligence-cloudflare-collector-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intelligence/collector-cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: intelligence/collector-cloudflare/package.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Collector HTTP contract tests
        run: npm test

      - name: Migration validation (local D1)
        run: npm run d1:migrations:apply:local

      - name: Production configuration guard
        run: |
          if npm run production:guard; then
            echo "Unexpected: production guard passed with repository placeholder configuration."
            exit 1
          else
            echo "Expected: production deployment remains blocked until a real external D1 database ID is configured outside Git."
          fi

      - name: Syntax check
        run: node --check worker.js

      - name: Wrangler dry-run validation
        run: npx wrangler deploy --dry-run

      - name: Validation artifact
        run: |
          mkdir -p ../../monitoring-report/intelligence-3.0
          {
            echo "Intelligence 3.0 Collector Validation"
            echo "Commit: $GITHUB_SHA"
            echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "HTTP contract: PASS"
            echo "Schema contract: PASS"
            echo "Local D1 migration: PASS"
            echo "Production guard: BLOCKED as expected"
            echo "Syntax: PASS"
            echo "Wrangler dry-run: PASS"
          } > ../../monitoring-report/intelligence-3.0/validation.txt

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-3-0-collector-validation
          path: monitoring-report/intelligence-3.0/validation.txt
          if-no-files-found: error

      - name: Production deployment gate reminder
        run: |
          echo "Validation only: no production deployment, no browser transport, and no credentials are used."
          echo "Production requires account/runtime, D1, Durable Object, retention, access, abuse and independent verification gates."
