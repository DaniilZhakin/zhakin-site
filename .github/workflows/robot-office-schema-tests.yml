name: Robot Office schema tests

on:
  push:
    branches:
      - feat/robot-office-data-layer-2026-10-31
  pull_request:
    branches:
      - feat/zhakin-robot-office-current-main-2026-10-30

permissions:
  contents: read

jobs:
  disposable-sqlite-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated schema tests
        run: python -m unittest discover -s robot-office/tests -v
