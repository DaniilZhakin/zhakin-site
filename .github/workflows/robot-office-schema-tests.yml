name: Robot Office schema tests

on:
  push:
    branches:
      - feat/robot-office-data-layer-2026-10-31
      - feat/robot-office-access-policy-2026-10-31
      - feat/robot-office-service-layer-2026-10-31
      - feat/robot-office-worker-adapter-2026-10-31
  pull_request:
    branches:
      - feat/zhakin-robot-office-current-main-2026-10-30
      - feat/robot-office-data-layer-2026-10-31
      - feat/robot-office-access-policy-2026-10-31
      - feat/robot-office-service-layer-2026-10-31
      - feat/robot-office-worker-adapter-2026-10-31

permissions:
  contents: read

jobs:
  disposable-sqlite-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated schema tests
        run: python -m unittest discover -s robot-office/tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run authorization policy tests
        run: node --test robot-office/tests/*.test.mjs
