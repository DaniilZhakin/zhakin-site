name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Inject site-wide AI assistant
        shell: python
        run: |
          from pathlib import Path
          for path in Path('.').rglob('*.html'):
              if path.name in {'google-site-verification.html', 'yandex_22fe3ff5da790924.html'}:
                  continue
              text = path.read_text(encoding='utf-8')
              if '/assets/js/main.js' in text or 'assets/js/main.js' in text:
                  continue
              marker = '</body>'
              if marker in text:
                  path.write_text(text.replace(marker, '<script src="/assets/js/main.js"></script>' + marker, 1), encoding='utf-8')
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
