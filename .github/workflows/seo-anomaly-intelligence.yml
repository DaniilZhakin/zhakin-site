name: SEO Anomaly Intelligence

on:
  schedule:
    - cron: '57 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  anomaly-intelligence:
    name: Persistent SEO anomaly intelligence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze persistent anomalies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p monitoring-history monitoring-report
          python3 intelligence/seo-anomaly-intelligence.py

      - name: Upload anomaly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-anomaly-report
          path: monitoring-report/
          if-no-files-found: warn

      - name: Commit anomaly history and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monitoring-history/seo-anomalies.json monitoring-report/anomalies.json monitoring-report/SEO-ANOMALIES.md
          if git diff --cached --quiet; then
            echo 'No anomaly-history or report changes to commit.'
          else
            git commit -m 'chore: update persistent SEO anomaly report'
            # Other scheduled monitoring workflows can advance main after checkout.
            # Rebase onto the latest main and retry using a normal, non-forced push.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase FETCH_HEAD; then
                git rebase --abort || true
                echo 'Unable to rebase anomaly report onto latest main; stopping safely.' >&2
                exit 1
              fi
              if git push origin HEAD:refs/heads/main; then
                echo "SEO anomaly report pushed successfully (attempt ${attempt})."
                exit 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "main advanced during push; retrying after fetch/rebase (${attempt}/3)."
                sleep "$attempt"
              fi
            done
            echo 'Unable to publish SEO anomaly report after 3 fetch/rebase attempts.' >&2
            exit 1
          fi
