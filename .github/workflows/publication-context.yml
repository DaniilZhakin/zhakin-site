name: Publication Context

on:
  push:
    paths:
      - 'intelligence/publication-context.py'
      - 'publications/*.html'
      - '.github/workflows/publication-context.yml'

permissions:
  contents: write

jobs:
  apply-context:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply publication context
        run: python3 intelligence/publication-context.py

      - name: Commit generated context
        run: |
          if git diff --quiet; then
            echo "No publication context changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications/*.html
          git commit -m "feat: add analytical context to publication pages"
          git push
