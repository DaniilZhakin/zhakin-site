name: Platform directory regression
on:
  pull_request:
    paths:
      - 'platform.html'
      - 'assets/css/platform.css'
      - 'assets/js/platform-directory.js'
      - 'tests/platform-directory.test.cjs'
      - 'tests/platform-directory-runtime.test.cjs'
      - '.github/workflows/platform-directory.yml'
  push:
    branches:
      - main
    paths:
      - 'platform.html'
      - 'assets/css/platform.css'
      - 'assets/js/platform-directory.js'
      - 'tests/platform-directory.test.cjs'
      - 'tests/platform-directory-runtime.test.cjs'
      - '.github/workflows/platform-directory.yml'
permissions:
  contents: read
jobs:
  platform-directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify platform directory source contracts
        run: node --test tests/platform-directory.test.cjs
      - name: Exercise directory search and filters at runtime
        run: node --test tests/platform-directory-runtime.test.cjs
