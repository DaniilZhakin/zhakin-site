name: Platform directory regression
on:
  pull_request:
    paths:
      - 'platform.html'
      - 'assets/css/platform.css'
      - 'assets/js/platform-directory.js'
      - 'index.html'
      - 'projects.html'
      - 'tests/platform-directory.test.cjs'
      - '.github/workflows/platform-directory.yml'
  push:
    branches:
      - main
      - feat/platform-directory-hub-20261108
    paths:
      - 'platform.html'
      - 'assets/css/platform.css'
      - 'assets/js/platform-directory.js'
      - 'index.html'
      - 'projects.html'
      - 'tests/platform-directory.test.cjs'
      - '.github/workflows/platform-directory.yml'
permissions:
  contents: read
jobs:
  platform-directory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify platform directory
        run: node --test tests/platform-directory.test.cjs
