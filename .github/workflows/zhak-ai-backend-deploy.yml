name: ЖАК Backend + PostHog Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4.148.0

      - name: Validate Worker syntax
        working-directory: intelligence/ai-backend-cloudflare
        run: node --check worker.js

      - name: Preflight required production settings
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          ZHAK_AI_SMOKE_URL: ${{ secrets.ZHAK_AI_SMOKE_URL }}
        run: |
          set -eu
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID OPENAI_API_KEY OPENAI_MODEL POSTHOG_HOST POSTHOG_PROJECT_ID POSTHOG_API_KEY ZHAK_AI_SMOKE_URL; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          echo "PASS: required production settings are present."

      - name: Configure Worker runtime secrets
        working-directory: intelligence/ai-backend-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          set -eu
          printf '%s' "$OPENAI_API_KEY" | wrangler secret put OPENAI_API_KEY
          printf '%s' "$OPENAI_MODEL" | wrangler secret put OPENAI_MODEL
          printf '%s' "$POSTHOG_HOST" | wrangler secret put POSTHOG_HOST
          printf '%s' "$POSTHOG_PROJECT_ID" | wrangler secret put POSTHOG_PROJECT_ID
          printf '%s' "$POSTHOG_API_KEY" | wrangler secret put POSTHOG_API_KEY

      - name: Deploy Worker
        working-directory: intelligence/ai-backend-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Smoke-test library and tools endpoint
        working-directory: intelligence/ai-backend-cloudflare
        env:
          ZHAK_AI_SMOKE_URL: ${{ secrets.ZHAK_AI_SMOKE_URL }}
        run: |
          set -eu
          BASE_URL="${ZHAK_AI_SMOKE_URL%/}"
          curl --fail-with-body --silent --show-error \
            -X POST "$BASE_URL/v1/tools" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://xn--80alhhq.xn--p1ai' \
            --data '{"question":"Покажи аналитику сайта за последние 7 дней"}' \
            -o /tmp/zhak-tools-smoke.json
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/zhak-tools-smoke.json','utf8')); if(d.mode!=='deterministic_tools'||d.library?.status?.knowledge!==true) { console.error('Tools/library smoke test failed'); process.exit(1); } console.log('PASS: tools endpoint and public knowledge library are available.');"

      - name: Smoke-test PostHog analytics data
        working-directory: intelligence/ai-backend-cloudflare
        run: |
          set -eu
          node <<'NODE'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync('/tmp/zhak-tools-smoke.json', 'utf8'));
          const analytics = response.analytics;
          const data = analytics && analytics.data;
          if (
            analytics?.configured !== true ||
            analytics?.available !== true ||
            data === null ||
            typeof data !== 'object' ||
            Object.keys(data).length === 0
          ) {
            console.error('PostHog smoke test failed: analytics is not configured, available, or returned a non-empty data payload.');
            process.exit(1);
          }
          console.log('PASS: PostHog returned a non-empty analytics payload for the requested 7-day window.');
          NODE

      - name: Smoke-test real AI answer endpoint
        working-directory: intelligence/ai-backend-cloudflare
        env:
          ZHAK_AI_SMOKE_URL: ${{ secrets.ZHAK_AI_SMOKE_URL }}
        run: |
          set -eu
          BASE_URL="${ZHAK_AI_SMOKE_URL%/}"
          curl --fail-with-body --silent --show-error \
            -X POST "$BASE_URL/v1/ask" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://xn--80alhhq.xn--p1ai' \
            --data '{"question":"Кратко объясни, чем занимается сайт Жакин.рф."}' \
            -o /tmp/zhak-ai-smoke.json
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/zhak-ai-smoke.json','utf8')); if(typeof d.answer!=='string'||!d.answer.trim()||!Array.isArray(d.sources)) { console.error('AI answer contract check failed'); process.exit(1); } console.log('PASS: /v1/ask returned a non-empty answer and a sources array.');"
