name: ЖАК AI Backend Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4.148.0

      - name: Validate Worker syntax
        working-directory: intelligence/ai-backend-cloudflare
        run: node --check worker.js

      - name: Deploy Worker
        working-directory: intelligence/ai-backend-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Configure Worker secrets
        working-directory: intelligence/ai-backend-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          printf '%s' "$OPENAI_API_KEY" | wrangler secret put OPENAI_API_KEY
          printf '%s' "$POSTHOG_API_KEY" | wrangler secret put POSTHOG_API_KEY

      - name: Smoke-test endpoint
        working-directory: intelligence/ai-backend-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZHAK_AI_SMOKE_URL: ${{ secrets.ZHAK_AI_SMOKE_URL }}
        run: |
          test -n "$ZHAK_AI_SMOKE_URL"
          curl --fail-with-body --silent --show-error             -X POST "$ZHAK_AI_SMOKE_URL/v1/ask"             -H 'Content-Type: application/json'             -H 'Origin: https://xn--80alhhq.xn--p1ai'             --data '{"question":"Проверка ЖАК: ответь кратко, что ты готов работать с данными сайта."}'
