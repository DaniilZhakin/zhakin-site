name: ЖАК Backend + PostHog Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4.148.0

      - name: Validate Worker syntax
        working-directory: intelligence/ai-backend-cloudflare
        run: node --check worker.js

      - name: Deploy Worker
        working-directory: intelligence/ai-backend-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Configure PostHog secrets
        working-directory: intelligence/ai-backend-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          set -eu
          test -n "$POSTHOG_HOST"
          test -n "$POSTHOG_PROJECT_ID"
          test -n "$POSTHOG_API_KEY"
          printf '%s' "$POSTHOG_HOST" | wrangler secret put POSTHOG_HOST
          printf '%s' "$POSTHOG_PROJECT_ID" | wrangler secret put POSTHOG_PROJECT_ID
          printf '%s' "$POSTHOG_API_KEY" | wrangler secret put POSTHOG_API_KEY

      - name: Smoke-test tools endpoint
        working-directory: intelligence/ai-backend-cloudflare
        env:
          ZHAK_AI_SMOKE_URL: ${{ secrets.ZHAK_AI_SMOKE_URL }}
        run: |
          set -eu
          test -n "$ZHAK_AI_SMOKE_URL"
          curl --fail-with-body --silent --show-error \
            -X POST "$ZHAK_AI_SMOKE_URL/v1/tools" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://xn--80alhhq.xn--p1ai' \
            --data '{"question":"Покажи аналитику сайта за последние 7 дней"}' \
            -o /tmp/zhak-smoke.json
          node -e "const d=require('/tmp/zhak-smoke.json'); if(d.mode!=='deterministic_tools'||!d.library||!d.library.status||d.library.status.knowledge!==true) { console.error(JSON.stringify(d)); process.exit(1); } console.log('PASS: deterministic tools endpoint and site knowledge library are available');"
