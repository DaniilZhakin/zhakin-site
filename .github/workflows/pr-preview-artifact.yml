name: PR Preview Artifact

on:
  pull_request:
    branches: [main]
    paths:
      - "publications/**"
      - "assets/**"
      - "publications.html"
      - "centers/**"
      - "office.html"
      - "index.html"
      - "sitemap.xml"
      - ".github/workflows/pr-preview-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Validate preview entry points
        shell: python
        run: |
          from pathlib import Path
          import sys

          required = [
              Path("publications.html"),
              Path("publications/global-trade-routes-finance.html"),
              Path("publications/economy-growth-living-standards.html"),
              Path("publications/future-office-operating-model.html"),
              Path("sitemap.xml"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              print("PREVIEW ARTIFACT: FAIL")
              print("Missing files:", ", ".join(missing))
              sys.exit(1)

          sitemap = Path("sitemap.xml").read_text(encoding="utf-8")
          if "/centers/" in sitemap:
              center_pages = [
                  Path("centers/index.html"),
                  Path("centers/analytical/index.html"),
                  Path("centers/asset-valuation/index.html"),
              ]
              missing_centers = [str(path) for path in center_pages if not path.is_file()]
              if missing_centers:
                  raise SystemExit(
                      "PREVIEW ARTIFACT: FAIL — sitemap references centers but files are missing: "
                      + ", ".join(missing_centers)
                  )
              homepage = Path("index.html")
              if not homepage.is_file() or 'href="/centers/"' not in homepage.read_text(encoding="utf-8"):
                  raise SystemExit("PREVIEW ARTIFACT: FAIL — center routes exist but homepage entry is missing")

          for path in required:
              data = path.read_bytes()
              if not data:
                  raise SystemExit(f"Empty preview file: {path}")
              if path.suffix == ".html":
                  text = data.decode("utf-8")
                  if "</html>" not in text.lower():
                      raise SystemExit(f"Incomplete HTML document: {path}")

          print("PREVIEW ARTIFACT: PASS")
          print(f"Validated {len(required)} required entry points")

      - name: Upload static preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: zhakin-site-pr-${{ github.event.pull_request.number || 'manual' }}-preview
          path: |
            *.html
            publications/
            centers/
            assets/
            sitemap.xml
            robots.txt
            CNAME
          if-no-files-found: error
          retention-days: 7
