name: SEO Trend Intelligence

on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trend-intelligence:
    name: SEO trend intelligence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze production trends
        shell: bash
        env:
          SITE: https://xn--80alhhq.xn--p1ai
        run: |
          set -euo pipefail
          mkdir -p monitoring-history monitoring-report

          python - <<'PY'
          import json, re, subprocess, time
          from pathlib import Path
          from statistics import mean
          from urllib.parse import urljoin

          site = 'https://xn--80alhhq.xn--p1ai'
          required = [
              '/', '/about.html', '/projects.html', '/publications.html', '/reception.html',
              '/publications/digital-ruble.html', '/publications/ai-financial-system.html',
              '/publications/ai-infrastructure.html', '/publications/ai-parliament.html',
              '/publications/understanding-state-and-law.html', '/publications/legal-architecture.html',
              '/publications/intellectual-economy.html', '/publications/economic-transition-1990s.html',
              '/publications/future-without-money.html', '/publications/food-infrastructure.html',
              '/publications/capital-requires-proof.html', '/publications/price-discovery.html',
          ]

          def fetch(url):
              started = time.monotonic()
              p = subprocess.run(['curl','-L','--fail-with-body','--silent','--show-error','--max-time','20','-D','-','-o','/tmp/seo-body',url], text=True, capture_output=True)
              elapsed = round((time.monotonic()-started)*1000)
              if p.returncode != 0:
                  return '', '', elapsed, p.stderr.strip()
              raw_headers = p.stdout
              body = Path('/tmp/seo-body').read_text(encoding='utf-8', errors='replace')
              return raw_headers, body, elapsed, ''

          def page_diff(previous_page, current_page):
              changes = []
              if previous_page is None:
                  return ['new page in monitored baseline']
              for key in ['available', 'canonical_ok', 'noindex', 'x_robots_tag', 'jsonld']:
                  old = previous_page.get(key)
                  new = current_page.get(key)
                  if old != new:
                      changes.append(f'{key}: {old} -> {new}')
              old_ms = previous_page.get('response_time_ms')
              new_ms = current_page.get('response_time_ms')
              if old_ms is not None and new_ms is not None and new_ms >= max(1000, old_ms * 1.5) and new_ms - old_ms >= 250:
                  changes.append(f'response_time_ms: {old_ms} -> {new_ms}')
              return changes

          def calculate_health(signals, critical_count=0, warning_count=0):
              required_pages = max(1, signals.get('required_pages', 0))
              availability = signals.get('available_pages', 0) / required_pages
              canonical = signals.get('canonical_ok_pages', 0) / required_pages
              jsonld = signals.get('jsonld_pages', 0) / required_pages
              noindex = signals.get('noindex_pages', 0)
              avg_ms = signals.get('avg_response_time_ms')

              score = 0.0
              score += 20.0 * (1.0 if signals.get('robots_ok') else 0.0)
              score += 15.0 * (1.0 if signals.get('sitemap_coverage') else 0.0)
              score += 20.0 * availability
              score += 15.0 * canonical
              score += 10.0 * jsonld
              score += 10.0 * max(0.0, 1.0 - min(1.0, noindex / required_pages))

              if avg_ms is None:
                  speed_score = 0.0
              elif avg_ms <= 500:
                  speed_score = 10.0
              elif avg_ms <= 800:
                  speed_score = 7.0
              elif avg_ms <= 1200:
                  speed_score = 4.0
              else:
                  speed_score = 0.0
              score += speed_score

              score -= min(10.0, critical_count * 5.0)
              score -= min(5.0, warning_count * 1.0)
              score = max(0.0, min(100.0, round(score, 1)))
              grade = 'healthy' if score >= 90 else ('warning' if score >= 75 else 'critical')
              return score, grade

          now = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
          snapshot = {'timestamp': now, 'site': site, 'pages': {}, 'signals': {}}

          rh, robots, ms, err = fetch(site + '/robots.txt')
          snapshot['signals']['robots_ok'] = bool(robots and 'User-agent: *' in robots and 'Allow: /' in robots and 'Sitemap: ' + site + '/sitemap.xml' in robots)
          rh, sitemap, ms, err = fetch(site + '/sitemap.xml')
          urls = re.findall(r'<loc>(.*?)</loc>', sitemap or '')
          snapshot['signals']['sitemap_urls'] = len(urls)
          snapshot['signals']['sitemap_unique'] = len(urls) == len(set(urls))
          snapshot['signals']['sitemap_coverage'] = all(urljoin(site, p) in urls for p in required)

          for path in required:
              url = urljoin(site, path)
              headers, html, elapsed, err = fetch(url)
              canonical = re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)', html, flags=re.I)
              header_noindex = bool(re.search(r'^X-Robots-Tag:\s*.*noindex', headers, flags=re.I|re.M))
              html_noindex = bool(re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex', html, flags=re.I))
              snapshot['pages'][path] = {
                  'available': bool(html),
                  'response_time_ms': elapsed,
                  'canonical_ok': bool(canonical and canonical[0].rstrip('/') == url.rstrip('/')),
                  'noindex': header_noindex or html_noindex,
                  'x_robots_tag': header_noindex,
                  'jsonld': bool(re.search(r'application/ld\+json', html, flags=re.I)),
              }

          snapshot['signals']['required_pages'] = len(required)
          snapshot['signals']['available_pages'] = sum(p['available'] for p in snapshot['pages'].values())
          snapshot['signals']['canonical_ok_pages'] = sum(p['canonical_ok'] for p in snapshot['pages'].values())
          snapshot['signals']['jsonld_pages'] = sum(p['jsonld'] for p in snapshot['pages'].values())
          snapshot['signals']['noindex_pages'] = sum(p['noindex'] for p in snapshot['pages'].values())
          times = [p['response_time_ms'] for p in snapshot['pages'].values() if p['available']]
          snapshot['signals']['avg_response_time_ms'] = round(mean(times), 1) if times else None
          snapshot['signals']['max_response_time_ms'] = max(times) if times else None

          history_path = Path('monitoring-history/seo-history.json')
          history = json.loads(history_path.read_text(encoding='utf-8')) if history_path.exists() else []
          previous_snapshot = history[-1] if history else None
          history.append(snapshot)
          history = history[-30:]
          history_path.write_text(json.dumps(history, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          warnings = []
          page_changes = {}
          critical_pages = []
          warning_pages = []
          if previous_snapshot:
              prev_signals = previous_snapshot.get('signals', {})
              for key in ['robots_ok','sitemap_unique','sitemap_coverage']:
                  if prev_signals.get(key) and not snapshot['signals'].get(key):
                      warnings.append(f'{key} regressed')
              if snapshot['signals']['available_pages'] < prev_signals.get('available_pages', snapshot['signals']['available_pages']):
                  warnings.append('available page count decreased')
              if snapshot['signals']['canonical_ok_pages'] < prev_signals.get('canonical_ok_pages', snapshot['signals']['canonical_ok_pages']):
                  warnings.append('canonical coverage decreased')
              if snapshot['signals']['jsonld_pages'] < prev_signals.get('jsonld_pages', snapshot['signals']['jsonld_pages']):
                  warnings.append('JSON-LD coverage decreased')
              if snapshot['signals']['noindex_pages'] > prev_signals.get('noindex_pages', snapshot['signals']['noindex_pages']):
                  warnings.append('noindex count increased')
              old_avg = prev_signals.get('avg_response_time_ms')
              new_avg = snapshot['signals'].get('avg_response_time_ms')
              if old_avg and new_avg and new_avg > old_avg * 1.5 and new_avg - old_avg >= 250:
                  warnings.append(f'average response time increased from {old_avg}ms to {new_avg}ms')

              for path, current_page in snapshot['pages'].items():
                  changes = page_diff(previous_snapshot.get('pages', {}).get(path), current_page)
                  if changes:
                      page_changes[path] = changes
                      if current_page.get('available') is False or current_page.get('canonical_ok') is False or current_page.get('noindex') is True:
                          critical_pages.append(path)
                      else:
                          warning_pages.append(path)

              for path in critical_pages:
                  warnings.append(f'critical page regression: {path}')
              for path in warning_pages:
                  warnings.append(f'page-level change: {path}')

          health_score, health_grade = calculate_health(snapshot['signals'], len(critical_pages), len(warning_pages))
          snapshot['signals']['health_score'] = health_score
          snapshot['signals']['health_grade'] = health_grade

          previous_score = None
          if previous_snapshot:
              previous_score = previous_snapshot.get('signals', {}).get('health_score')
              if previous_score is None:
                  previous_score, _ = calculate_health(previous_snapshot.get('signals', {}))
          if previous_score is None:
              trend_direction = 'baseline'
              trend_delta = None
          else:
              trend_delta = round(health_score - previous_score, 1)
              trend_direction = 'improving' if trend_delta > 1 else ('declining' if trend_delta < -1 else 'stable')

          status = 'critical' if critical_pages or not snapshot['signals']['robots_ok'] or not snapshot['signals']['sitemap_coverage'] else ('warning' if warnings else 'ok')
          report = {
              'timestamp': now,
              'history_points': len(history),
              'current': snapshot['signals'],
              'health_score': health_score,
              'health_grade': health_grade,
              'trend_direction': trend_direction,
              'trend_delta': trend_delta,
              'baseline_timestamp': previous_snapshot.get('timestamp') if previous_snapshot else now,
              'warnings': warnings,
              'page_changes': page_changes,
              'critical_pages': critical_pages,
              'warning_pages': warning_pages,
              'status': status,
          }
          Path('monitoring-report/seo-trend.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('monitoring-report/latest.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('monitoring-report/health.json').write_text(json.dumps({
              'timestamp': now,
              'site': site,
              'health_score': health_score,
              'health_grade': health_grade,
              'trend_direction': trend_direction,
              'trend_delta': trend_delta,
              'baseline_timestamp': previous_snapshot.get('timestamp') if previous_snapshot else now,
              'status': status,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          md = ['# SEO 3.1 — Health & Trend Intelligence', '', f'Snapshot: `{now}`', f'History points: **{len(history)}**', f'Status: **{status.upper()}**', f'Health score: **{health_score}/100 ({health_grade.upper()})**', f'Trend: **{trend_direction.upper()}**' + (f' ({trend_delta:+.1f})' if trend_delta is not None else ''), '', '## Current signals', '']
          for k, v in snapshot['signals'].items():
              md.append(f'- `{k}`: **{v}**')
          md += ['', '## Page-level intelligence', '']
          if not page_changes:
              md.append('No page-level change detected.')
          else:
              for path, changes in page_changes.items():
                  md.append(f'### `{path}`')
                  for change in changes:
                      md.append(f'- {change}')
          md += ['', '## Anomaly detection', '']
          md.append('No regression detected.' if not warnings else '\n'.join('- ' + w for w in warnings))
          Path('monitoring-report/SEO-TREND.md').write_text('\n'.join(md) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False))
          PY

      - name: Upload trend report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-trend-report
          path: monitoring-report/
          if-no-files-found: warn

      - name: Commit trend history and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monitoring-history/seo-history.json monitoring-report/seo-trend.json monitoring-report/latest.json monitoring-report/health.json monitoring-report/SEO-TREND.md
          if git diff --cached --quiet; then
            echo 'No trend-history or report changes to commit.'
          else
            git commit -m 'chore: update SEO health score and trend report'
            git push
          fi
