name: Mobile Navigation Integrity

on:
  pull_request:
    paths:
      - "assets/css/style.css"
      - "scripts/test_mobile_navigation.py"
      - ".github/workflows/mobile-navigation-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "assets/css/style.css"
      - "scripts/test_mobile_navigation.py"
      - ".github/workflows/mobile-navigation-integrity.yml"

permissions:
  contents: read

jobs:
  mobile-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate mobile navigation safeguards
        run: python -m unittest scripts/test_mobile_navigation.py -v
