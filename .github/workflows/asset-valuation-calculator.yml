name: ZHAKIN TEAM expert centers checks
on:
  pull_request:
    paths:
      - 'centers/asset-valuation/**'
      - 'centers/analytical/**'
      - 'data/analytical-monitoring/**'
      - 'scripts/fetch-analytical-observations.cjs'
      - 'tests/analytical-ingestion.test.cjs'\n      - 'scripts/append-analytical-history.cjs'\n      - 'tests/analytical-history.test.cjs'\n      - 'assets/js/analytical-monitoring-charts.js'
      - 'centers/index.html'
      - 'sitemap.xml'
      - 'tests/analytical-center.test.cjs'
      - 'assets/js/asset-valuation-calculator.js'
      - 'tests/asset-valuation-calculator.test.cjs'
      - '.github/workflows/asset-valuation-calculator.yml'
      - '.github/workflows/analytical-monitoring-refresh.yml'
  workflow_dispatch:
jobs:
  valuation-calculator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run valuation calculator tests
        run: node --test tests/asset-valuation-calculator.test.cjs
      - name: Run Analytical Center tests
        run: node --test tests/analytical-center.test.cjs
      - name: Run analytical ingestion parser tests
        run: node --test tests/analytical-ingestion.test.cjs

  analytical-source-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify live official data sources without writing observations
        run: node scripts/fetch-analytical-observations.cjs --check
