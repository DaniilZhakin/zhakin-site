name: ЖАК Knowledge Integrity

on:
  push:
    paths:
      - 'data/zhak-knowledge.json'
      - 'data/intelligence-config.json'
      - 'data/institutional-registry.json'
      - 'data/projects.json'
      - 'data/political-analysis.json'
      - '.github/workflows/zhak-knowledge-integrity.yml'
  pull_request:
    paths:
      - 'data/zhak-knowledge.json'
      - 'data/intelligence-config.json'
      - 'data/institutional-registry.json'
      - 'data/projects.json'
      - 'data/political-analysis.json'
      - '.github/workflows/zhak-knowledge-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate ЖАК knowledge contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const readJson = (file) => {
            const raw = fs.readFileSync(file, 'utf8');
            try { return JSON.parse(raw); }
            catch (e) { throw new Error(file + ': invalid JSON: ' + e.message); }
          };

          const knowledge = readJson('data/zhak-knowledge.json');
          const config = readJson('data/intelligence-config.json');
          const registry = readJson('data/institutional-registry.json');
          const projects = readJson('data/projects.json');
          const political = readJson('data/political-analysis.json');

          if (knowledge.service !== 'zhakin-ai') throw new Error('Knowledge service mismatch');
          if (!knowledge.response_contract?.answer || !Array.isArray(knowledge.response_contract?.sources)) {
            throw new Error('Knowledge response contract is incomplete');
          }
          if (config.knowledge_core !== '/data/zhak-knowledge.json') {
            throw new Error('intelligence-config knowledge_core mismatch');
          }
          if (config.security?.api_key_client_side !== false) {
            throw new Error('API key client-side exposure must remain disabled');
          }
          if (config.security?.backend_required !== true) {
            throw new Error('Backend requirement must remain enabled');
          }
          if (!Array.isArray(knowledge.knowledge_sources) || knowledge.knowledge_sources.length < 1) {
            throw new Error('Knowledge source registry is empty');
          }
          if (!Array.isArray(registry.entities?.projects) || registry.entities.projects.length === 0) {
            throw new Error('Institutional project registry is empty');
          }
          if (!Array.isArray(projects.projects) || projects.projects.length === 0) {
            throw new Error('Public project registry is empty');
          }
          if (political.scope !== 'political-analysis' || political.public_route !== '/political-analysis.html') {
            throw new Error('Political analysis registry scope/route mismatch');
          }
          if (!Array.isArray(political.object_types) || political.object_types.length < 1) {
            throw new Error('Political analysis object registry is empty');
          }
          if (!Array.isArray(political.analytical_dimensions) || political.analytical_dimensions.length < 1) {
            throw new Error('Political analysis dimensions are empty');
          }
          if (!Array.isArray(political.records)) {
            throw new Error('Political analysis records must be an array');
          }

          const allowedObjectTypes = new Set(political.object_types);
          const requiredFields = political.record_contract?.required || [];
          const allowedStatuses = new Set(['active', 'inactive', 'historical', 'under-review', 'draft']);
          const recordIds = new Set();

          for (const record of political.records) {
            for (const field of requiredFields) {
              if (record[field] === undefined || record[field] === null || record[field] === '') {
                throw new Error('Political record ' + (record.id || '<unknown>') + ': missing required field ' + field);
              }
            }
            if (!allowedObjectTypes.has(record.object_type)) {
              throw new Error('Political record ' + record.id + ': unsupported object_type ' + record.object_type);
            }
            if (!allowedStatuses.has(record.status)) {
              throw new Error('Political record ' + record.id + ': unsupported status ' + record.status);
            }
            if (recordIds.has(record.id)) {
              throw new Error('Political record duplicate id: ' + record.id);
            }
            recordIds.add(record.id);
            if (!/^\d{4}-\d{2}-\d{2}$/.test(record.source_date)) {
              throw new Error('Political record ' + record.id + ': source_date must be YYYY-MM-DD');
            }
            if (!/^\d{4}-\d{2}-\d{2}$/.test(record.last_reviewed)) {
              throw new Error('Political record ' + record.id + ': last_reviewed must be YYYY-MM-DD');
            }
            if (record.relations !== undefined && !Array.isArray(record.relations)) {
              throw new Error('Political record ' + record.id + ': relations must be an array');
            }
            if (record.scenario_notes !== undefined && (typeof record.scenario_notes !== 'object' || Array.isArray(record.scenario_notes))) {
              throw new Error('Political record ' + record.id + ': scenario_notes must be an object');
            }
          }

          for (const record of political.records) {
            for (const relation of record.relations || []) {
              if (!relation.target_id || !recordIds.has(relation.target_id)) {
                throw new Error('Political record ' + record.id + ': relation target not found: ' + (relation.target_id || '<empty>'));
              }
            }
          }

          for (const source of knowledge.knowledge_sources) {
            const file = '.' + source.path;
            if (!fs.existsSync(file)) throw new Error('Knowledge source missing: ' + source.path);
          }

          const publicPaths = [
            '/institutional.html',
            '/projects.html',
            '/publications.html',
            '/reception.html',
            '/international-geography.html',
            '/political-analysis.html'
          ];
          for (const publicPath of publicPaths) {
            if (!fs.existsSync('.' + publicPath)) {
              throw new Error('Public knowledge route missing: ' + publicPath);
            }
          }

          console.log('ЖАК knowledge integrity: PASS');
          console.log('Knowledge core, config, registries and public source routes are consistent.');
          NODE

      - name: Security contract check
        run: |
          if grep -RniE 'sk-[A-Za-z0-9_-]{20,}|OPENAI_API_KEY[[:space:]]*=' data intelligence .github 2>/dev/null; then
            echo "Potential API credential material detected in tracked configuration."
            exit 1
          fi
          echo "Security contract: PASS"
