name: Publication Graph Integrity

on:
  push:
    branches: [main]
    paths:
      - 'publications.html'
      - 'publications/**'
      - 'assets/js/publications.js'
      - 'sitemap.xml'
      - 'intelligence/publication-integrity.py'
      - '.github/workflows/publication-integrity.yml'
  pull_request:
    paths:
      - 'publications.html'
      - 'publications/**'
      - 'assets/js/publications.js'
      - 'sitemap.xml'
      - 'intelligence/publication-integrity.py'
      - '.github/workflows/publication-integrity.yml'
  workflow_run:
    workflows: ["Publication Context"]
    types: [completed]

permissions:
  contents: read

jobs:
  integrity:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Validate publication graph
        run: python3 intelligence/publication-integrity.py
      - name: Record validation checkpoint
        run: echo "Publication integrity validation executed on $GITHUB_SHA"
