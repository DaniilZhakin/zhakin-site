<script>
(async()=>{
const res=await fetch('/data/platform-graph.json',{cache:'no-store'}); if(!res.ok) throw new Error('graph');
const graph=await res.json();
const dirs=graph.nodes.filter(n=>n.type==='direction');
const pubs=graph.nodes.filter(n=>n.type==='publication');
const byId=new Map(pubs.map(p=>[p.id,p]));
const belongs=graph.edges.filter(e=>e.type==='belongs_to');
const related=graph.edges.filter(e=>e.type==='related_to');
const byDir=new Map(dirs.map(d=>[d.id,pubs.filter(p=>belongs.some(e=>e.from===p.id&&e.to===d.id))]));
const filters=document.getElementById('filters'), grid=document.getElementById('map-grid');
const labels=[['all','Все направления'],...dirs.map(d=>[d.id,d.title])];
function renderFilter(active){
filters.innerHTML=labels.map(([id,title])=>'<button class="map-filter '+(active===id?'active':'')+'" data-id="'+id+'">'+title+'</button>').join('');
filters.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>renderFilter(b.dataset.id)));
grid.innerHTML=dirs.filter(d=>active==='all'||active===d.id).map(d=>{
const list=byDir.get(d.id)||[];
return '<article class="map-card"><h3>'+d.title+'</h3><div class="map-count">'+list.length+' публикаций</div><div class="map-pubs">'+list.map(p=>'<a href="'+p.url+'">'+p.title+'</a>').join('')+'</div></article>';
}).join('');
}
renderFilter('all');
const rg=document.getElementById('relation-grid');
rg.innerHTML=related.map(e=>{
const a=byId.get(e.from),b=byId.get(e.to); if(!a||!b)return '';
return '<article class="relation-card"><a href="'+a.url+'">'+a.title+'</a><span class="relation-arrow">↕ связано с</span><a href="'+b.url+'">'+b.title+'</a></article>';
}).join('');
document.getElementById('relations').hidden=related.length===0;
})().catch(()=>{document.getElementById('map-grid').innerHTML='<p>Карта знаний временно недоступна. Основной раздел публикаций продолжает работать.</p>'});
</script>
